<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShadsTech Chat</title>
  <link rel="stylesheet" href="css/chat.css" />
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <header class="sidebar-head">
        <div class="me">
          <div class="avatar" id="me-avatar">?</div>
          <div>
            <div class="me-name" id="me-name">Loading…</div>
            <div class="me-status">online</div>
          </div>
        </div>
        <button id="logout-btn" class="icon-btn" type="button" title="Log out">⏻</button>
      </header>

      <div class="search-wrap">
        <input id="search" type="search" placeholder="Search people…" autocomplete="off" />
      </div>

      <ul id="contact-list" class="contact-list"></ul>
      <p id="contacts-empty" class="empty hidden">
        No other users yet. Invite a friend to sign up!
      </p>
    </aside>

    <!-- Chat pane -->
    <section class="chat-pane">
      <div id="welcome" class="welcome">
        <h2>ShadsTech Chat</h2>
        <p>Select a person to start chatting.</p>
      </div>

      <div id="chat-view" class="chat-view hidden">
        <header class="chat-head">
          <button id="back-btn" class="icon-btn back" type="button">←</button>
          <div class="avatar" id="chat-avatar">?</div>
          <div>
            <div class="chat-name" id="chat-name"></div>
            <div class="chat-sub">direct message</div>
          </div>
        </header>

        <div id="messages" class="messages"></div>

        <form id="composer" class="composer">
          <input id="message-input" type="text" placeholder="Type a message"
                 autocomplete="off" maxlength="4000" />
          <button type="submit" class="send-btn" aria-label="Send">➤</button>
        </form>
      </div>
    </section>
  </div>

  <script type="module" src="js/chat.js"></script>
</body>
</html>
